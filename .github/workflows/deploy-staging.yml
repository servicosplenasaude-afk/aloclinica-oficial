name: Deploy to Sandbox

on:
  workflow_dispatch:
  push:
    branches: [sandbox]

env:
  CLOUDFLARE_ACCOUNT_ID: 33720391faeb23516de3151780648caf
  STAGING_SUPABASE_PROJECT_REF: hikttmmwxcjmzexxhgda

jobs:
  deploy-frontend:
    name: Frontend - Build + Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.STAGING_VITE_SENTRY_DSN }}
          VITE_APP_ENV: sandbox
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Deploy frontend to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name aloclinica-sandbox --branch sandbox

      - name: Health check
        shell: bash
        run: |
          for path in / /agendar /auth/paciente; do
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error "https://sandbox.aloclinica.com.br${path}" > /dev/null; then
                echo "${path}: OK (attempt ${attempt})"
                break
              fi
              if [ "${attempt}" = "6" ]; then
                echo "::error::Health check failed for ${path}."
                exit 1
              fi
              sleep 5
            done
          done

  deploy-supabase:
    name: Supabase Sandbox - Edge Functions
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publish operational release metadata
        run: supabase secrets set APP_ENV=sandbox APP_RELEASE="$GITHUB_SHA" --project-ref "${STAGING_SUPABASE_PROJECT_REF}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: |
          mapfile -t functions < <(
            git diff --name-only HEAD^ HEAD -- 'supabase/functions/**' |
              awk -F/ '$2 == "functions" && $3 != "_shared" { print $3 }' |
              sort -u
          )
          if [ "${#functions[@]}" -eq 0 ]; then
            echo "No Edge Functions changed in this commit."
            exit 0
          fi
          for function_name in "${functions[@]}"; do
            supabase functions deploy "$function_name" --project-ref "${STAGING_SUPABASE_PROJECT_REF}" --use-api
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
