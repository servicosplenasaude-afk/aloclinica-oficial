name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SUPABASE_PROJECT_REF: pwxvvimdtmvziynbspgx
  CLOUDFLARE_ACCOUNT_ID: 33720391faeb23516de3151780648caf

jobs:
  deploy-frontend:
    name: Frontend — Build + Deploy Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # Public key Mercado Pago — pública por design (acessível no bundle JS)
          VITE_MERCADOPAGO_PUBLIC_KEY: APP_USR-b35f421a-132b-4421-8499-cef0b3decf54
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Deploy frontend to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name aloclinica-production --branch main

      - name: Health check
        shell: bash
        run: |
          for path in / /agendar /auth/paciente; do
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error "https://aloclinica.com.br${path}" > /dev/null; then
                echo "${path}: OK (attempt ${attempt})"
                break
              fi
              if [ "${attempt}" = "6" ]; then
                echo "::error::Health check failed for ${path}."
                exit 1
              fi
              sleep 5
            done
          done

  deploy-supabase:
    name: Supabase — Edge Functions
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        # No global --no-verify-jwt: the CLI honors per-function verify_jwt from
        # supabase/config.toml (JWT required by default; disabled only for webhooks).
        run: |
          supabase functions deploy \
            --project-ref ${{ env.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  notify:
    name: Resultado do Deploy
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-supabase]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend (https://aloclinica.com.br) | ${{ needs.deploy-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Supabase Edge Functions | ${{ needs.deploy-supabase.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "By: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
