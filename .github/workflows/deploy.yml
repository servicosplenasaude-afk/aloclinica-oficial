name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      function_names:
        description: "Edge Functions específicas, separadas por vírgula (vazio = todas)"
        required: false
        type: string

env:
  SUPABASE_PROJECT_REF: pwxvvimdtmvziynbspgx
  CLOUDFLARE_ACCOUNT_ID: 33720391faeb23516de3151780648caf

jobs:
  deploy-frontend:
    name: Frontend — Build + Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_ENV: production
          # Public key Mercado Pago — pública por design (acessível no bundle JS)
          VITE_MERCADOPAGO_PUBLIC_KEY: APP_USR-b35f421a-132b-4421-8499-cef0b3decf54
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Deploy frontend to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name aloclinica-production --branch main

      - name: Health check
        shell: bash
        run: |
          for path in / /agendar /auth/paciente; do
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error "https://aloclinica.com.br${path}" > /dev/null; then
                echo "${path}: OK (attempt ${attempt})"
                break
              fi
              if [ "${attempt}" = "6" ]; then
                echo "::error::Health check failed for ${path}."
                exit 1
              fi
              sleep 5
            done
          done

  deploy-supabase:
    name: Supabase — Edge Functions
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publish operational release metadata
        run: supabase secrets set APP_ENV=production APP_RELEASE="$GITHUB_SHA" --project-ref "${SUPABASE_PROJECT_REF}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply vetted Partner API migration
        run: |
          set -euo pipefail
          migration="supabase/migrations/20260823133000_partner_api_v1.sql"
          expected="0eee139a5f7ece4ea313c7da5177b6d4a281eeabcd7c7b9f7e431359a902a66c"
          actual="$(sha256sum "${migration}" | awk '{print $1}')"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::Partner API migration checksum mismatch; refusing database write."
            exit 1
          fi
          jq -Rs '{query: .}' "${migration}" > /tmp/partner-api-migration.json
          status="$(curl -sS -o /tmp/partner-api-migration-response.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/partner-api-migration.json)"
          if [[ ! "${status}" =~ ^2 ]]; then
            echo "::error::Vetted Partner API migration failed with HTTP ${status}. Response suppressed."
            exit 1
          fi
          echo "Vetted Partner API migration applied idempotently."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        # No global --no-verify-jwt: the CLI honors per-function verify_jwt from
        # supabase/config.toml (JWT required by default; disabled only for webhooks).
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -n "${REQUESTED_FUNCTIONS}" ]; then
              IFS=',' read -ra functions <<< "${REQUESTED_FUNCTIONS}"
              for function_name in "${functions[@]}"; do
                if [[ ! "${function_name}" =~ ^[a-z0-9-]+$ ]] || [ ! -f "supabase/functions/${function_name}/index.ts" ] || [[ "${function_name}" =~ ^seed-test-(users|doctors)$ ]]; then
                  echo "::error::Invalid or blocked function: ${function_name}"
                  exit 1
                fi
              done
            else
              mapfile -t functions < <(
                find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -printf '%h\n' |
                  awk -F/ '$3 != "_shared" { print $3 }' |
                  grep -vE '^(seed-test-users|seed-test-doctors)$' |
                  sort -u
              )
            fi
          else
            if ! git cat-file -e "${BASE_SHA}^{commit}"; then
              echo "::error::Base commit ${BASE_SHA} unavailable; refusing a false-success deploy."
              exit 1
            fi
            mapfile -t functions < <(
              git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}" -- 'supabase/functions/**' |
                awk -F/ '$2 == "functions" && $3 != "_shared" { print $3 }' |
                grep -vE '^(seed-test-users|seed-test-doctors)$' |
                sort -u
            )
          fi
          if [ "${#functions[@]}" -eq 0 ]; then
            echo "No Edge Functions changed in this commit."
            exit 0
          fi
          for function_name in "${functions[@]}"; do
            if [ ! -f "supabase/functions/${function_name}/index.ts" ]; then
              echo "Skipping removed function directory: ${function_name}"
              continue
            fi
            supabase functions deploy "$function_name" --project-ref "${SUPABASE_PROJECT_REF}" --use-api
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BASE_SHA: ${{ github.event.before }}
          REQUESTED_FUNCTIONS: ${{ inputs.function_names }}

  notify:
    name: Resultado do Deploy
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-supabase]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend (https://aloclinica.com.br) | ${{ needs.deploy-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Supabase Edge Functions | ${{ needs.deploy-supabase.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "By: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
