name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Known good commit SHA to rebuild and deploy
        required: true
      confirm:
        description: Type ROLLBACK to confirm
        required: true

env:
  CLOUDFLARE_ACCOUNT_ID: 33720391faeb23516de3151780648caf

jobs:
  rollback:
    name: Redeploy known good commit to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production
    if: ${{ inputs.confirm == 'ROLLBACK' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Deploy rollback to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name aloclinica-production --branch main

      - name: Health check
        run: npm run health:production
        env:
          PROD_SITE_URL: https://aloclinica.com.br
          SUPABASE_PROJECT_REF: pwxvvimdtmvziynbspgx
