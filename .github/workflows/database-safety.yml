name: Database Safety Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/verify-migration-reconciliation.mjs"
      - ".github/workflows/database-safety.yml"
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: pwxvvimdtmvziynbspgx

jobs:
  reconcile-migrations:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: List linked migrations (read-only)
        shell: bash
        run: |
          set -o pipefail
          supabase link --project-ref "${SUPABASE_PROJECT_REF}"
          supabase migration list --linked 2>&1 | tee migration-list.txt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Export production schema without data (read-only)
        run: supabase db dump --linked --schema public --file remote-public-schema.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Scan and summarize schema evidence
        run: node scripts/summarize-schema-dump.mjs remote-public-schema.sql remote-schema-summary.json remote-public-schema.redacted.sql
      - name: Publish restricted reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-reconciliation-${{ github.run_id }}
          path: |
            migration-list.txt
            remote-public-schema.redacted.sql
            remote-schema-summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Fail on migration divergence
        run: node scripts/verify-migration-reconciliation.mjs migration-list.txt
